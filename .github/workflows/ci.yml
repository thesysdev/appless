# CI: typecheck, unit tests, and the prompt/contract drift guard on every
# push and pull request. patch-package runs via the postinstall hook, so a
# plain `npm ci` reproduces the local toolchain exactly.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:drift
